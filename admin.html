<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MZG Admin · Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #03fa6e; --primary-dark: #014b21; --primary-light: #6affa0;
            --bg-main: #0a0e0a; --bg-panel: #011a0c; --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08); --text-main: #f0f2f5; --text-sec: #a0b8aa;
            --danger: #ff4d4d; --warning: #ffb020; --info: #4db8ff; --shadow: 0 12px 40px rgba(0,0,0,0.5);
            --radius: 16px; --font: 'Space Grotesk', sans-serif;
        }
        [data-theme="light"] {
            --bg-main: #f0f7f0; --bg-panel: #ffffff; --bg-card: rgba(255, 255, 255, 0.7);
            --border: rgba(0, 0, 0, 0.08); --text-main: #011a0c; --text-sec: #1a3a2a;
            --shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        body { font-family: var(--font); background: var(--bg-main); color: var(--text-main); transition: 0.3s; overflow-x: hidden; }
        button, input, select, textarea { font-family: var(--font); } .hidden { display: none !important; }
        
        /* Login */
        #loginScreen { position: fixed; inset: 0; z-index: 1000; background: var(--bg-main); display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 50px; max-width: 420px; width: 100%; text-align: center; box-shadow: var(--shadow); }
        .login-card input { width: 100%; padding: 14px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); text-align: center; font-size: 1.1rem; }
        .btn-main { background: var(--primary); color: #011a0c; border: none; padding: 12px 24px; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-main:hover { background: var(--primary-light); transform: translateY(-2px); }
        
        /* Layout */
        #app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        #sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); padding: 20px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 5px; }
        .nav-btn { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 12px; border: none; background: transparent; color: var(--text-sec); cursor: pointer; text-align: left; font-size: 0.95rem; font-weight: 500; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background: rgba(3, 250, 110, 0.1); color: var(--primary); }
        .badge-count { background: var(--danger); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; margin-left: auto; }
        
        #main { padding: 30px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-actions { display: flex; gap: 15px; align-items: center; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 50px; cursor: pointer; transition: 0.3s; display: flex; gap: 8px; align-items: center; }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        
        /* KPIs con Monospace */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: var(--bg-panel); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .kpi-label { font-size: 0.8rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; }
        .kpi-val { font-family: ui-monospace, 'Courier New', monospace; font-size: 2rem; font-weight: 700; margin-top: 8px; color: var(--primary); }
        
        /* Tablas y Paginación */
        .table-wrap { background: var(--bg-panel); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg-card); padding: 15px; text-align: left; font-size: 0.8rem; color: var(--text-sec); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tr:hover td { background: rgba(3,250,110,0.02); }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .page-btn { background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .page-btn.active { background: var(--primary); color: #011a0c; border-color: var(--primary); }
        
        /* Modales */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 900; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 650px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; }
        .form-group { margin-bottom: 15px; } .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-sec); }
        .form-control { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); }
        
        /* Etiquetas */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .bg-pending { background: rgba(255,176,32,0.15); color: var(--warning); } .bg-completed { background: rgba(3,250,110,0.15); color: var(--primary); } .bg-danger { background: rgba(255,77,77,0.15); color: var(--danger); }

        @media (max-width: 900px) {
            #app { grid-template-columns: 1fr; }
            #sidebar { position: fixed; bottom: 0; top: auto; height: auto; width: 100%; flex-direction: row; justify-content: space-around; border-right: none; border-top: 1px solid var(--border); z-index: 500; padding: 10px; }
            .nav-btn { flex-direction: column; font-size: 0.7rem; padding: 8px; }
            #main { padding: 20px 15px 90px; }
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-card">
            <h2>MZG Admin</h2>
            <input type="password" id="loginInput" placeholder="API Key Maestra">
            <button class="btn-main" id="loginBtn">Entrar</button>
            <p id="loginError" style="color:var(--danger); font-size:0.85rem; margin-top:10px;"></p>
        </div>
    </div>

    <div id="app" class="hidden">
        <aside id="sidebar">
            <h3 style="color:var(--primary); margin-bottom:20px; text-align:center;">&lt;/&gt; MZG</h3>
            <button class="nav-btn active" data-view="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>
            <button class="nav-btn" data-view="pedidos"><i class="fas fa-box"></i> Pedidos <span class="badge-count hidden" id="badgePedidos">0</span></button>
            <button class="nav-btn" data-view="productos"><i class="fas fa-tags"></i> Productos</button>
            <button class="nav-btn" data-view="contactos"><i class="fas fa-envelope"></i> Bandeja <span class="badge-count hidden" id="badgeContactos">0</span></button>
            <div style="margin-top: auto;"><button class="nav-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Salir</button></div>
        </aside>

        <main id="main">
            <div class="topbar">
                <h1 id="pageTitle">Dashboard</h1>
                <div class="top-actions">
                    <button class="btn-outline" id="themeToggle"><i class="fas fa-moon"></i> Tema</button>
                    <button class="btn-outline" onclick="loadAll()"><i class="fas fa-sync"></i> Actualizar</button>
                </div>
            </div>

            <!-- VISTA DASHBOARD -->
            <section id="view-dashboard">
                <div class="kpi-grid" id="kpiGrid"></div>
                <div style="background:var(--bg-panel); border-radius:var(--radius); padding:20px; border:1px solid var(--border);">
                    <h3>Últimos Pedidos</h3>
                    <div id="ultimosPedidos" style="margin-top:15px;"></div>
                </div>
            </section>

            <!-- VISTA PEDIDOS -->
            <section id="view-pedidos" class="hidden">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                    <input type="search" id="searchPedidos" class="form-control" placeholder="Buscar cliente o ID..." style="max-width:300px;">
                    <button class="btn-outline" onclick="exportToCSV()"><i class="fas fa-file-csv"></i> Exportar CSV</button>
                </div>
                <div class="table-wrap">
                    <table><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="pedidosTbody"></tbody></table>
                </div>
                <div class="pagination" id="paginationContainer"></div>
            </section>

            <!-- VISTA PRODUCTOS -->
            <section id="view-productos" class="hidden">
                <div style="display:flex; justify-content:flex-end; margin-bottom:20px;">
                    <button class="btn-main" style="width:auto;" onclick="openModalProducto()"><i class="fas fa-plus"></i> Nuevo Producto</button>
                </div>
                <div class="table-wrap">
                    <table><thead><tr><th>Imagen</th><th>Nombre</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="productosTbody"></tbody></table>
                </div>
            </section>

            <!-- VISTA CONTACTOS/COTIZACIONES -->
            <section id="view-contactos" class="hidden">
                <div class="table-wrap">
                    <table><thead><tr><th>Tipo</th><th>Nombre</th><th>Email</th><th>Mensaje</th><th>Estado</th></tr></thead><tbody id="bandejaTbody"></tbody></table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL PEDIDO (Con Historial) -->
    <div class="modal" id="modalPedido">
        <div class="modal-card">
            <button style="position:absolute; right:20px; top:20px; border:none; background:none; font-size:1.5rem; color:var(--text-main); cursor:pointer;" onclick="document.getElementById('modalPedido').classList.remove('open')">&times;</button>
            <h2 id="mPedidoId"></h2>
            <div id="mPedidoContent" style="margin-top:20px;"></div>
        </div>
    </div>

    <!-- MODAL PRODUCTO (Con Imagen Drive) -->
    <div class="modal" id="modalProducto">
        <div class="modal-card">
            <button style="position:absolute; right:20px; top:20px; border:none; background:none; font-size:1.5rem; color:var(--text-main); cursor:pointer;" onclick="document.getElementById('modalProducto').classList.remove('open')">&times;</button>
            <h2 id="mProdTitle">Nuevo Producto</h2>
            <form id="formProducto" style="margin-top:20px;">
                <input type="hidden" id="prodId">
                <div class="form-group"><label>Nombre</label><input type="text" id="prodNombre" class="form-control" required></div>
                <div class="form-group"><label>Descripción</label><textarea id="prodDesc" class="form-control" rows="2"></textarea></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="form-group"><label>Precio (MXN)</label><input type="number" id="prodPrecio" class="form-control" required step="0.01"></div>
                    <div class="form-group"><label>Categoría</label><input type="text" id="prodCat" class="form-control" value="General"></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="form-group"><label>Etiqueta Visual</label><select id="prodEtiqueta" class="form-control"><option value="">Ninguna</option><option value="Nuevo">Nuevo</option><option value="Oferta">Oferta</option><option value="Top">Top</option></select></div>
                    <div class="form-group"><label>Estado</label><select id="prodActivo" class="form-control"><option value="true">Activo (Visible)</option><option value="false">Inactivo (Oculto)</option></select></div>
                </div>
                <div class="form-group">
                    <label>Imagen del Producto</label>
                    <input type="file" id="prodImagenFile" accept="image/*" class="form-control" style="margin-bottom:5px;">
                    <small style="color:var(--text-sec)">O sube una imagen desde tu dispositivo. Se guardará en Drive.</small>
                    <input type="hidden" id="prodImagenUrl">
                    <img id="prodImagenPreview" style="width:100%; height:150px; object-fit:cover; border-radius:10px; margin-top:10px; display:none;">
                </div>
                <button type="submit" class="btn-main" id="btnSaveProd">Guardar Producto</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxbYBqYx1uTF2TfzC34zwgqsk-s76UHvQ0dVhirC8qQGWxY1IQnq1eVjb_c5WPpy8if/exec';
        const LS_KEY = 'mzg-admin-key';
        let API_KEY = localStorage.getItem(LS_KEY) || '';
        let state = { pedidos: [], productos: [], cotizaciones: [], contactos: [], stats: {} };
        let currentPage = 1; const itemsPerPage = 10;
        
        // THEME
        const root = document.documentElement, themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('admin-theme') === 'light') { root.setAttribute('data-theme', 'light'); themeToggle.innerHTML = '<i class="fas fa-sun"></i> Claro'; }
        themeToggle.onclick = () => {
            if (root.hasAttribute('data-theme')) { root.removeAttribute('data-theme'); themeToggle.innerHTML = '<i class="fas fa-moon"></i> Tema'; localStorage.setItem('admin-theme', 'dark'); }
            else { root.setAttribute('data-theme', 'light'); themeToggle.innerHTML = '<i class="fas fa-sun"></i> Claro'; localStorage.setItem('admin-theme', 'light'); }
        };

        // API
        async function apiPost(payload) {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ ...payload, apiKey: API_KEY }), headers: { 'Content-Type': 'text/plain' } });
            return res.json();
        }

        // LOGIN
        document.getElementById('loginBtn').onclick = async () => {
            const key = document.getElementById('loginInput').value;
            const err = document.getElementById('loginError');
            if (!key) return;
            API_KEY = key;
            try {
                const r = await apiPost({ accion: 'estadisticas' });
                if (r.ok) { localStorage.setItem(LS_KEY, key); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); loadAll(); }
                else { err.textContent = 'API Key inválida'; API_KEY = ''; }
            } catch { err.textContent = 'Error de red'; API_KEY = ''; }
        };
        document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem(LS_KEY); location.reload(); };

        // NAVEGACIÓN
        document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('section[id^="view-"]').forEach(s => s.classList.add('hidden'));
                btn.classList.add('active');
                document.getElementById('view-' + btn.dataset.view).classList.remove('hidden');
                document.getElementById('pageTitle').textContent = btn.textContent.trim();
            };
        });

        // CARGAR DATOS
        async function loadAll() {
            const data = await apiPost({ accion: 'dashboard_data' });
            if (data.ok) {
                state.pedidos = (data.pedidos || []).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                state.productos = data.productos || [];
                state.cotizaciones = data.cotizaciones || [];
                state.contactos = data.contactos || [];
                
                // KPIs
                const s = await apiPost({ accion: 'estadisticas' });
                if (s.ok) {
                    const st = s.stats;
                    document.getElementById('kpiGrid').innerHTML = `
                        <div class="kpi-card"><div class="kpi-label">Ingresos Totales</div><div class="kpi-val">$${st.ingresos_totales.toLocaleString()}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Pedidos Totales</div><div class="kpi-val">${st.total_pedidos}</div></div>
                        <div class="kpi-card"><div class="kpi-label">Ticket Promedio</div><div class="kpi-val">$${st.ticket_promedio.toLocaleString()}</div></div>
                    `;
                }

                renderPedidos();
                renderProductos();
                renderBandeja();
                actualizarBadges();
            }
        }

        function actualizarBadges() {
            const p = state.pedidos.filter(x => x.estado === 'Pendiente').length;
            const c = state.contactos.filter(x => !x.leido).length + state.cotizaciones.filter(x => x.estado !== 'Atendida').length;
            document.getElementById('badgePedidos').textContent = p; document.getElementById('badgePedidos').classList.toggle('hidden', p===0);
            document.getElementById('badgeContactos').textContent = c; document.getElementById('badgeContactos').classList.toggle('hidden', c===0);
        }

        // RENDER PEDIDOS + PAGINACIÓN
        function renderPedidos() {
            const tbody = document.getElementById('pedidosTbody');
            const start = (currentPage - 1) * itemsPerPage, end = start + itemsPerPage;
            const paginated = state.pedidos.slice(start, end);
            
            tbody.innerHTML = paginated.map(p => `<tr>
                <td style="font-family:monospace">${p.id_pedido}</td>
                <td>${p.cliente_nombre}</td>
                <td>$${p.total}</td>
                <td><span class="badge ${p.estado === 'Completado' ? 'bg-completed' : 'bg-pending'}">${p.estado}</span></td>
                <td><button class="btn-outline" onclick="openModalPedido('${p.id_pedido}')">Ver</button></td>
            </tr>`).join('');
            
            const totalPages = Math.ceil(state.pedidos.length / itemsPerPage);
            document.getElementById('paginationContainer').innerHTML = Array.from({length: totalPages}, (_, i) => `
                <button class="page-btn ${i+1 === currentPage ? 'active' : ''}" onclick="currentPage=${i+1}; renderPedidos()">${i+1}</button>
            `).join('');
        }

        // MODAL PEDIDO (CON HISTORIAL)
        window.openModalPedido = (id) => {
            const p = state.pedidos.find(x => x.id_pedido === id);
            document.getElementById('mPedidoId').textContent = p.id_pedido;
            
            const historial = state.pedidos.filter(x => x.cliente_email === p.cliente_email && x.id_pedido !== p.id_pedido);
            const gastoTotal = historial.reduce((s, x) => s + Number(x.total), 0);
            let histHtml = historial.length > 0 ? `<div style="background:var(--bg-card); padding:15px; border-radius:10px; margin-top:15px;"><h4>Historial del Cliente</h4><p>Compras previas: ${historial.length} | Gasto total: $${gastoTotal}</p></div>` : '<p style="margin-top:15px;font-size:0.9rem;color:var(--text-sec)">Cliente nuevo (sin historial).</p>';

            document.getElementById('mPedidoContent').innerHTML = `
                <p><strong>Cliente:</strong> ${p.cliente_nombre} (${p.cliente_email})</p>
                <p><strong>Total:</strong> $${p.total}</p>
                <div style="margin-top:15px;">
                    <label>Cambiar Estado:</label>
                    <select class="form-control" onchange="cambiarEstado('${p.id_pedido}', this.value)">
                        <option value="Pendiente" ${p.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option value="Completado" ${p.estado === 'Completado' ? 'selected' : ''}>Completado (Envía correo)</option>
                        <option value="Cancelado" ${p.estado === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                    </select>
                </div>
                ${histHtml}
            `;
            document.getElementById('modalPedido').classList.add('open');
        };
        
        window.cambiarEstado = async (id, estado) => {
            await apiPost({ accion: 'actualizar_estado_pedido', id_pedido: id, estado });
            loadAll(); alert('Estado actualizado');
        };

        // EXPORTAR A CSV
        window.exportToCSV = () => {
            let csv = "ID,Fecha,Cliente,Email,Total,Estado\n";
            state.pedidos.forEach(p => { csv += `${p.id_pedido},${p.fecha},${p.cliente_nombre},${p.cliente_email},${p.total},${p.estado}\n`; });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'pedidos_mzg.csv'; link.click();
        };

        // RENDER PRODUCTOS
        function renderProductos() {
            document.getElementById('productosTbody').innerHTML = state.productos.map(p => `<tr>
                <td><img src="${p.imagen_url}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;"></td>
                <td>${p.nombre}</td>
                <td>$${p.precio}</td>
                <td>${p.activo ? 'Visible' : 'Oculto'}</td>
                <td><button class="btn-outline" onclick="editProd('${p.id}')"><i class="fas fa-edit"></i></button></td>
            </tr>`).join('');
        }

        window.openModalProducto = () => {
            document.getElementById('formProducto').reset();
            document.getElementById('prodId').value = '';
            document.getElementById('prodImagenPreview').style.display = 'none';
            document.getElementById('mProdTitle').textContent = 'Nuevo Producto';
            document.getElementById('modalProducto').classList.add('open');
        };

        window.editProd = (id) => {
            const p = state.productos.find(x => x.id === id);
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodNombre').value = p.nombre;
            document.getElementById('prodDesc').value = p.descripcion || '';
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodCat').value = p.categoria;
            document.getElementById('prodEtiqueta').value = p.etiqueta || '';
            document.getElementById('prodActivo').value = p.activo ? 'true' : 'false';
            document.getElementById('prodImagenUrl').value = p.imagen_url || '';
            if(p.imagen_url) { document.getElementById('prodImagenPreview').src = p.imagen_url; document.getElementById('prodImagenPreview').style.display = 'block'; }
            document.getElementById('mProdTitle').textContent = 'Editar Producto';
            document.getElementById('modalProducto').classList.add('open');
        };

        // SUBIDA DE IMAGEN
        document.getElementById('prodImagenFile').onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('prodImagenUrl').value = base64; // temporalmente base64
                    document.getElementById('prodImagenPreview').src = base64; document.getElementById('prodImagenPreview').style.display = 'block';
                };
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('formProducto').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSaveProd'); btn.textContent = 'Guardando...'; btn.disabled = true;
            let imgUrl = document.getElementById('prodImagenUrl').value;
            
            // Si es Base64 (imagen nueva), subir a Drive
            if (imgUrl.startsWith('data:image')) {
                const up = await apiPost({ accion: 'subir_imagen', base64: imgUrl });
                if (up.ok) imgUrl = up.url;
            }
            
            const payload = {
                accion: document.getElementById('prodId').value ? 'actualizar_producto' : 'nuevo_producto',
                id: document.getElementById('prodId').value || undefined,
                nombre: document.getElementById('prodNombre').value,
                descripcion: document.getElementById('prodDesc').value,
                precio: document.getElementById('prodPrecio').value,
                categoria: document.getElementById('prodCat').value,
                etiqueta: document.getElementById('prodEtiqueta').value,
                activo: document.getElementById('prodActivo').value === 'true',
                imagen_url: imgUrl
            };
            
            const res = await apiPost(payload);
            btn.textContent = 'Guardar'; btn.disabled = false;
            if (res.ok) { document.getElementById('modalProducto').classList.remove('open'); loadAll(); }
        };

        // RENDER BANDEJA (Contactos + Cotizaciones)
        function renderBandeja() {
            const all = [
                ...state.contactos.map(c => ({ tipo: 'Contacto', ...c })),
                ...state.cotizaciones.map(c => ({ tipo: 'Cotización', ...c }))
            ].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            
            document.getElementById('bandejaTbody').innerHTML = all.map(c => `<tr>
                <td><span class="badge ${c.tipo === 'Contacto' ? 'bg-pending' : 'bg-completed'}">${c.tipo}</span></td>
                <td>${c.nombre}</td>
                <td>${c.email}</td>
                <td>${c.mensaje ? c.mensaje.substring(0,30) + '...' : '-'}</td>
                <td>${c.leido || c.estado === 'Atendida' ? 'Visto' : 'Nuevo'}</td>
            </tr>`).join('');
        }

        if (API_KEY) { document.getElementById('loginInput').value = API_KEY; document.getElementById('loginBtn').click(); }
    </script>
</body>
</html>
